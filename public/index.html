<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RelayDock Studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">RD</span>
      <span class="brand-name">RelayDock</span>
      <span class="brand-subtitle">Agent Relay Studio</span>
    </div>
    <div class="topbar-status">
      <span id="healthBadge" class="status-pill"><span class="status-dot"></span><span>连接中</span></span>
      <button id="workspaceButton" class="workspace-button" type="button" title="配置工作区">
        <span class="workspace-button-label">工作区</span>
        <span id="workspaceLabel" class="workspace-label"></span>
      </button>
      <button id="refreshButton" class="icon-button" title="刷新" aria-label="刷新">↻</button>
    </div>
  </header>

  <main class="workbench">
    <aside class="sidebar sessions-sidebar">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Workspace</p>
          <h2>任务会话</h2>
        </div>
        <div class="heading-actions">
          <button id="importCodexButton" class="secondary-button compact-button" type="button" title="导入本机 Codex 会话">导入 Codex</button>
          <button id="newSessionButton" class="icon-button primary" title="新建会话" aria-label="新建会话">+</button>
        </div>
      </div>
      <div id="sessionList" class="session-list"></div>
      <div class="sidebar-section">
        <div class="section-heading">
          <h3>模型供应商</h3>
          <button id="addProviderButton" class="text-icon-button" title="添加供应商" aria-label="添加供应商">+</button>
        </div>
        <div id="providerList" class="provider-list"></div>
      </div>
      <footer class="sidebar-footer">
        <span class="security-dot"></span>
        <span>仅监听本机 · 密钥不入账本</span>
      </footer>
    </aside>

    <section class="conversation-panel">
      <div class="conversation-header">
        <div class="title-block">
          <p class="eyebrow">Unified task trace</p>
          <h1 id="activeTitle">选择一个任务</h1>
          <p id="activeMeta" class="active-meta">RelayDock 会在这里合并 Codex 与外部模型的进展。</p>
        </div>
        <div class="header-badges">
          <div id="timelineModeSwitch" class="mode-switch" role="group" aria-label="时间线显示模式">
            <button type="button" class="mode-switch-button" data-mode="full" title="显示交接、工具、审批等完整处理信息">完整轨迹</button>
            <button type="button" class="mode-switch-button" data-mode="chat" title="只显示用户与模型的会话消息">仅会话</button>
          </div>
          <span id="leaseBadge" class="status-pill neutral">无写锁</span>
          <span id="approvalCount" class="status-pill warning">0 审批</span>
          <button id="contractButton" class="secondary-button" type="button">任务契约</button>
        </div>
      </div>

      <div id="timeline" class="timeline" aria-live="polite"></div>

      <div class="composer">
        <div class="composer-toolbar">
          <label class="select-label">接手模型
            <select id="providerSelect"></select>
          </label>
          <span class="composer-hint">外部输出按不可信证据记录</span>
        </div>
        <textarea id="composerText" rows="3" placeholder="描述下一步，或让接手模型继续当前任务…"></textarea>
        <div class="composer-actions">
          <div class="secondary-actions">
            <button id="checkpointButton" class="secondary-button" type="button">创建 Checkpoint</button>
            <button id="packetButton" class="secondary-button" type="button">预览 Relay Packet</button>
            <button id="exportButton" class="secondary-button" type="button">导出给 Codex</button>
          </div>
          <button id="sendButton" class="primary-button" type="button">
            <span>交给接手模型</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <div class="inspector-tabs" role="tablist" aria-label="检查器">
        <button class="tab-button active" data-tab="checkpoint" type="button">Checkpoint</button>
        <button class="tab-button" data-tab="packet" type="button">Packet</button>
        <button class="tab-button" data-tab="approvals" type="button">审批</button>
        <button class="tab-button" data-tab="diff" type="button">Diff</button>
      </div>
      <div id="inspectorBody" class="inspector-body"></div>
    </aside>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <p class="eyebrow">RelayDock</p>
          <h2 id="modalTitle">新建会话</h2>
        </div>
        <button id="modalCloseButton" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <form id="modalForm" class="modal-form"></form>
      <div id="modalError" class="form-error hidden"></div>
      <div class="modal-actions">
        <button id="modalCancelButton" class="secondary-button" type="button">取消</button>
        <button id="modalSubmitButton" class="primary-button" type="button">保存</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
